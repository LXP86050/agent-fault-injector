[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-fault-injector"
version = "0.1.0"
description = "Chaos experiments for tool-calling LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lokesh Pulivarthi" }]
keywords = ["llm", "agents", "chaos-engineering", "fault-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-PyYAML",
]

[project.scripts]
afi = "afi.cli:main"

[project.urls]
Homepage = "https://github.com/LXP86050/agent-fault-injector"
Repository = "https://github.com/LXP86050/agent-fault-injector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
afi = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=afi --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["src", "."]

[tool.coverage.run]
branch = true
source = ["afi"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "examples", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["afi", "examples"]

[tool.ruff.lint.per-file-ignores]
"examples/demo.py" = ["E402"]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/afi", "examples"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
no_implicit_reexport = true
