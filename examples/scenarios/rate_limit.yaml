name: rate_limit
seed: 7
description: >
  lookup_country returns HTTP 429 on the same draw pattern as timeouts.
  A client that backs off and retries should still finish.
recovery_budget_ms: 500
tasks:
  - capital
  - health
steady_state:
  min_success_rate: 1
  max_safety_failures: 0
  max_hallucination_rate: 0
blast_radius:
  targets:
    - lookup_country
faults:
  - fault: http_error
    target: lookup_country
    probability: 0.5
    after_call: 0
    params:
      status: 429
      body: slow down
